<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novedades en YouTube</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;background:#0d0d0f;color:#eee}main{max-width:1100px;margin:auto;padding:52px 24px}.hero{text-align:center}.hero h1{font-size:clamp(2rem,5vw,3.5rem);margin:.2em 0}.hero p{color:#aaa}.panel{max-width:650px;margin:32px auto;padding:22px;background:#1b1b20;border-radius:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex:1;min-width:240px;flex-direction:column;gap:6px}.field label{font-size:.85rem;color:#bbb}.field input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #444;border-radius:10px;background:#101014;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:999px;padding:12px 18px;background:#ff0033;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#2b2b33}.status{text-align:center;color:#aaa;margin:18px 0;min-height:1.4em}.error{color:#ff899d;white-space:pre-wrap}.channel{margin:30px 0}.channel h2{border-bottom:1px solid #333;padding-bottom:10px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.video{display:block;color:#eee;text-decoration:none;background:#18181d;border-radius:12px;overflow:hidden}.video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.video h3{font-size:1rem;line-height:1.3;margin:12px 13px 6px}.video small{display:block;color:#999;margin:0 13px 14px}.hint{font-size:.82rem;color:#999;line-height:1.5}
  </style>
</head>
<body>
<main>
  <header class="hero">
    <h1>Novedades en YouTube</h1>
    <p>Carga tu archivo de favoritos local para ver los videos recientes.</p>
  </header>

  <section class="panel">
    <div class="field">
      <label for="apiKey">API key de YouTube Data API v3</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="Pegar aquí la API key">
    </div>
    <div class="row" style="margin-top:14px">
      <div class="field">
        <label for="bookmarks">Archivo local de marcadores</label>
        <input id="bookmarks" type="file" accept=".html,text/html">
      </div>
    </div>
    <div class="actions">
      <button id="load" type="button">Cargar novedades</button>
      <button id="clear" class="secondary" type="button">Limpiar</button>
    </div>
    <p class="hint">El archivo se procesa en este navegador y no se sube a GitHub. La clave no se guarda.</p>
  </section>

  <p id="status" class="status">Esperando archivo…</p>
  <section id="content"></section>
</main>
<script src="script.js" defer></script>
</body>
</html>
